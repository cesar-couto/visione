<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cognitive Vision Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Cognitive Vision Dashboard</h1>
    <div id="dashboard">
        <div id="video-streams">
            <h2>Live Streams</h2>
            <!-- Video streams will be added here -->
        </div>
        <div id="data">
            <h2>Real-time Data</h2>
            <p>Total People: <span id="total-people">...</span></p>
            <h3>People by Role:</h3>
            <ul id="people-by-role">
                <!-- Role data will be added here -->
            </ul>
            <h2>Activity Heatmap</h2>
            <div id="heatmap">
                <!-- Heatmap will be rendered here -->
            </div>
            <h2>Hourly Snapshots</h2>
            <div id="snapshots">
                <!-- Snapshots will be listed here -->
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
