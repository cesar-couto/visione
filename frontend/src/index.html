<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cognitive Vision Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Cognitive Vision Dashboard</h1>
        <button id="theme-toggle">Toggle Dark Mode</button>
    </header>
    <div id="dashboard">
        <div id="video-streams">
            <h2>Live Streams</h2>
            <div class="video-placeholder">
                <div class="video-label">Camera 01 - Entrance</div>
            </div>
            <div class="video-placeholder">
                <div class="video-label">Camera 02 - 2nd Floor</div>
            </div>
             <div class="video-placeholder">
                <div class="video-label">Camera 03 - 360 View</div>
            </div>
        </div>
        <div id="data">
            <h2>Real-time Data</h2>
            <p>Total People: <span id="total-people">...</span></p>
            <h3>People by Role:</h3>
            <ul id="people-by-role">
                <!-- Role data will be added here -->
            </ul>
            <h2>Activity Heatmap</h2>
            <div id="heatmap-container">
                <!-- Heatmap will be rendered here -->
            </div>
            <h2>Daily Production</h2>
            <div id="production-chart-container">
                <canvas id="productionChart"></canvas>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/heatmap.js@2.0.5/build/heatmap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="script.js"></script>
</body>
</html>
